<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahsulotlar</title>
    <!-- Kun/tun rejimi: ranglar + rejim boshqaruvi (defer qo'yilmaydi!) -->
    <link rel="stylesheet" href="/tema.css">
    <script src="/tema.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background-color: var(--fon);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--matn);
        }
        .container { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
        .card {
            background-color: var(--karta); border-radius: 10px;
            box-shadow: 0 4px 20px var(--soya); padding: 24px 28px;
        }
        .card-header {
            display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap;
        }
        .card-header h1 { color: var(--kok); font-size: 20px; }
        .search-input {
            flex: 1; min-width: 200px; max-width: 340px;
            padding: 9px 12px; border: 1.5px solid var(--chegara-kok); border-radius: 6px;
            font-size: 14px; background-color: var(--fon2); outline: none; font-family: inherit;
        }
        .search-input:focus { border-color: var(--kok); background-color: var(--karta); }
        .add-btn {
            margin-left: auto;
            padding: 9px 18px; background-color: var(--kok); color: var(--karta); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .add-btn:hover { background-color: var(--kok-hover); }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--chegara); white-space: nowrap; }
        th {
            color: var(--kok-och); font-size: 12px; text-transform: uppercase;
            background-color: var(--fon2);
        }
        tr:hover td { background-color: var(--fon4); }
        .turi-badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600;
        }
        .turi-gatoviy { background-color: var(--yashil-fon); color: var(--yashil-toq); }
        .turi-metraj { background-color: var(--sariq-fon); color: var(--sariq-toq2); }
        .kategoriya-badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600;
            background-color: var(--fon3); color: var(--kok-toq);
        }
        .muted { color: var(--matn4); }
        .edit-btn {
            padding: 6px 12px; background-color: var(--fon3); color: var(--kok-toq); border: 1px solid var(--chegara-kok);
            border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; margin-right: 6px;
            transition: background-color 0.2s;
        }
        .edit-btn:hover { background-color: var(--chegara3); }
        .del-btn {
            padding: 6px 12px; background-color: var(--qizil-fon); color: var(--qizil); border: 1px solid var(--qizil-3);
            border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .del-btn:hover { background-color: var(--qizil-2); }
        .empty-row td { text-align: center; color: var(--matn4); padding: 24px; white-space: normal; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: var(--parda);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--karta); border-radius: 10px; padding: 28px 32px;
            width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
            box-shadow: 0 8px 32px var(--soya3);
        }
        .modal h2 { color: var(--kok); font-size: 18px; margin-bottom: 18px; }
        .form-group { margin-bottom: 14px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .form-group label {
            display: block; margin-bottom: 5px; color: var(--kok-och);
            font-size: 12px; font-weight: 600; text-transform: uppercase;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 9px 12px; border: 1.5px solid var(--chegara-kok); border-radius: 6px;
            font-size: 14px; color: var(--matn); background-color: var(--fon2); outline: none;
            transition: border-color 0.2s; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--kok); background-color: var(--karta);
        }
        .form-group input[readonly] {
            background-color: var(--fon6); color: var(--kok-och); font-weight: 600; cursor: default;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions .save-btn {
            flex: 1; padding: 10px; background-color: var(--kok); color: var(--karta); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .modal-actions .save-btn:hover { background-color: var(--kok-hover); }
        .modal-actions .cancel-btn {
            padding: 10px 18px; background-color: var(--fon5); color: var(--kok-och); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .modal-error {
            color: var(--qizil); font-size: 13px; margin-top: 10px; text-align: center; display: none;
        }
    </style>
</head>
<body>

<nav th:replace="~{fragment :: navbar}"></nav>
<div th:replace="~{fragment :: xabar}"></div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Mahsulotlar</h1>
            <input type="text" class="search-input" id="searchInput"
                   placeholder="Qidirish: nomi, kodi, kategoriya, magazin...">
            <button class="add-btn" id="openModalBtn">+ Yangi mahsulot</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Kodi</th>
                    <th>Nomi</th>
                    <th>Kategoriya</th>
                    <th>Turi</th>
                    <th>Birlik</th>
                    <th>Bo'yi</th>
                    <th>Eni</th>
                    <th>Kv</th>
                    <th>Zavod narxi (umumiy)</th>
                    <th>Magazin</th>
                    <th>Yaratgan</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="mahsulotTbody">
                <tr class="empty-row"><td colspan="13">Yuklanmoqda...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Mahsulot qo'shish/tahrirlash modali -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">Yangi mahsulot</h2>

        <div class="form-row">
            <div class="form-group">
                <label for="mh_nomi">Nomi *</label>
                <input type="text" id="mh_nomi" placeholder="Mahsulot nomi" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="mh_kod">Kodi *</label>
                <input type="text" id="mh_kod" placeholder="Masalan: GL-1024" autocomplete="off">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="mh_kategoriya">Kategoriya</label>
                <select id="mh_kategoriya">
                    <option value="">— Tanlanmagan —</option>
                </select>
            </div>
            <div class="form-group">
                <label for="mh_turi">Turi *</label>
                <select id="mh_turi">
                    <option value="gatoviy">Gatoviy</option>
                    <option value="metraj">Metraj</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="mh_birlik">Birlik</label>
                <select id="mh_birlik">
                    <option value="dona">Dona</option>
                    <option value="metr">Metr</option>
                    <option value="kv.metr">Kv.metr</option>
                </select>
            </div>
            <div class="form-group">
                <label for="mh_zavod">Zavod narxi (1 kv uchun)</label>
                <div style="display:flex; gap:8px;">
                    <input type="number" id="mh_zavod" min="0" step="0.01" placeholder="0" style="flex:1">
                    <select id="mh_valyuta" style="width:90px">
                        <option value="USD" selected>$</option>
                        <option value="UZS">so'm</option>
                    </select>
                </div>
                <div id="kursHint" style="font-size:12px; color:var(--kok-och); margin-top:5px; display:none;"></div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="mh_boyi">Bo'yi (m)</label>
                <input type="number" id="mh_boyi" min="0" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="mh_eni">Eni (m)</label>
                <input type="number" id="mh_eni" min="0" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="mh_kv">Kv (avto)</label>
                <input type="text" id="mh_kv" readonly value="—" tabindex="-1">
            </div>
        </div>

        <div class="form-group">
            <label for="mh_magazin">Magazin</label>
            <select id="mh_magazin">
                <option value="">— Tanlanmagan —</option>
            </select>
        </div>

        <p class="modal-error" id="modalError"></p>
        <div class="modal-actions">
            <button class="save-btn" id="saveBtn">Saqlash</button>
            <button class="cancel-btn" id="cancelBtn">Bekor qilish</button>
        </div>
    </div>
</div>


<script>
    const tbody = document.getElementById('mahsulotTbody');
    const overlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalError = document.getElementById('modalError');
    const searchInput = document.getElementById('searchInput');

    let mahsulotlar = [];
    let editingId = null;

    // Xabar fragment.html :: xabar dan keladi (global notification)
    function toastKorsat(matn, ok) {
        xabar(matn, ok ? 'ok' : 'err');
    }

    function esc(s) {
        return (s == null ? '' : String(s))
            .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;');
    }

    function sonFormat(n) {
        return n == null ? '' : Number(n).toLocaleString('ru-RU');
    }

    // ===== Jadval =====
    function jadvalniChiz() {
        const q = searchInput.value.trim().toLowerCase();
        const list = !q ? mahsulotlar : mahsulotlar.filter(m =>
            (m.nomi || '').toLowerCase().includes(q) ||
            (m.kod || '').toLowerCase().includes(q) ||
            (m.kategoriyaNomi || '').toLowerCase().includes(q) ||
            (m.magazinNomi || '').toLowerCase().includes(q)
        );

        if (!list.length) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="13">' +
                (q ? 'Qidiruv bo\u2018yicha hech narsa topilmadi' : 'Mahsulotlar yo\u2018q') +
                '</td></tr>';
            return;
        }

        tbody.innerHTML = list.map(m => `
            <tr>
                <td class="muted">${m.id}</td>
                <td>${esc(m.kod) || '<span class="muted">—</span>'}</td>
                <td><b>${esc(m.nomi)}</b></td>
                <td>${m.kategoriyaNomi ? `<span class="kategoriya-badge">${esc(m.kategoriyaNomi)}</span>` : '<span class="muted">—</span>'}</td>
                <td><span class="turi-badge ${m.turi === 'gatoviy' ? 'turi-gatoviy' : 'turi-metraj'}">${esc(m.turi)}</span></td>
                <td>${esc(m.birlik) || '<span class="muted">—</span>'}</td>
                <td>${m.boyi ?? '<span class="muted">—</span>'}</td>
                <td>${m.eni ?? '<span class="muted">—</span>'}</td>
                <td>${m.kv != null ? '<b>' + m.kv + '</b>' : '<span class="muted">—</span>'}</td>
                <td>${m.zavodNarxi != null ? sonFormat(m.zavodNarxi) : '<span class="muted">—</span>'}</td>
                <td>${esc(m.magazinNomi) || '<span class="muted">—</span>'}</td>
                <td>${esc(m.yaratganFish) || '<span class="muted">—</span>'}</td>
                <td>
                    <button class="edit-btn" data-id="${m.id}">Tahrirlash</button>
                    <button class="del-btn" data-id="${m.id}" data-name="${esc(m.nomi)}">O'chirish</button>
                </td>
            </tr>
        `).join('');
    }

    searchInput.addEventListener('input', jadvalniChiz);

    async function loadMahsulotlar() {
        try {
            const res = await fetch('/admin/get-mahsulotlar');
            if (!res.ok) throw new Error();
            mahsulotlar = await res.json();
            jadvalniChiz();
        } catch (e) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="13">Yuklashda xatolik</td></tr>';
        }
    }

    // ===== Modal ma'lumotlari =====
    async function loadMagazinSelect(tanlanganId) {
        const select = document.getElementById('mh_magazin');
        try {
            const res = await fetch('/admin/get-magazin-nomlar');
            if (!res.ok) throw new Error();
            const magazinlar = await res.json();
            select.innerHTML = '<option value="">— Tanlanmagan —</option>' +
                magazinlar.map(m => `<option value="${m.id}">${esc(m.nomi)}</option>`).join('');
            select.value = tanlanganId != null ? String(tanlanganId) : '';
        } catch (e) {
            select.innerHTML = '<option value="">— Yuklashda xatolik —</option>';
        }
    }

    async function loadKategoriyaSelect(tanlanganId) {
        const select = document.getElementById('mh_kategoriya');
        try {
            const res = await fetch('/admin/get-kategoriyalar');
            if (!res.ok) throw new Error();
            const kategoriyalar = await res.json();
            select.innerHTML = '<option value="">— Tanlanmagan —</option>' +
                kategoriyalar.map(k => `<option value="${k.id}">${esc(k.nomi)}</option>`).join('');
            select.value = tanlanganId != null ? String(tanlanganId) : '';
        } catch (e) {
            select.innerHTML = '<option value="">— Yuklashda xatolik —</option>';
        }
    }

    // ===== Valyuta / kurs =====
    function joriyKv() {
        const boyi = parseFloat(document.getElementById('mh_boyi').value);
        const eni = parseFloat(document.getElementById('mh_eni').value);
        if (isNaN(boyi) || isNaN(eni)) return null;
        return Math.round(boyi * eni * 100) / 100;
    }

    function kursHintYangila() {
        const hint = document.getElementById('kursHint');
        const valyuta = document.getElementById('mh_valyuta').value;
        const narx = parseFloat(document.getElementById('mh_zavod').value);

        if (isNaN(narx) || narx <= 0) {
            hint.style.display = 'none';
            return;
        }

        const kv = joriyKv();
        const umumiy = (kv != null && kv > 0) ? narx * kv : narx;
        const kvMatn = (kv != null && kv > 0)
            ? kv + ' kv × ' + narx + (valyuta === 'USD' ? '$' : ' so‘m') + ' = '
            : '';

        if (valyuta === 'USD') {
            if (window._usdKurs) {
                hint.textContent = kvMatn +
                    (Math.round(umumiy * 100) / 100) + '$ ≈ ' +
                    Math.round(umumiy * window._usdKurs).toLocaleString('ru-RU') +
                    ' so‘m (1 USD = ' + Math.round(window._usdKurs).toLocaleString('ru-RU') + ' UZS)';
            } else {
                hint.textContent = kvMatn + (Math.round(umumiy * 100) / 100) +
                    '$ — kurs yuklanmadi, so‘mga aylantirish serverda bajariladi';
            }
        } else {
            hint.textContent = kvMatn +
                Math.round(umumiy).toLocaleString('ru-RU') + ' so‘m (umumiy)';
        }
        hint.style.display = 'block';
    }
    document.getElementById('mh_zavod').addEventListener('input', kursHintYangila);
    document.getElementById('mh_valyuta').addEventListener('change', kursHintYangila);

    // ===== Kv avtomatik hisoblash =====
    function kvYangila() {
        const boyi = parseFloat(document.getElementById('mh_boyi').value);
        const eni = parseFloat(document.getElementById('mh_eni').value);
        const kvInput = document.getElementById('mh_kv');
        kvInput.value = (!isNaN(boyi) && !isNaN(eni))
            ? (Math.round(boyi * eni * 100) / 100).toString()
            : '—';
    }
    document.getElementById('mh_boyi').addEventListener('input', () => { kvYangila(); kursHintYangila(); });
    document.getElementById('mh_eni').addEventListener('input', () => { kvYangila(); kursHintYangila(); });

    // ===== Modal ochish/yopish =====
    async function modalOchish(mahsulot) {
        modalError.style.display = 'none';
        editingId = mahsulot ? mahsulot.id : null;
        modalTitle.textContent = mahsulot ? 'Mahsulotni tahrirlash' : 'Yangi mahsulot';

        document.getElementById('mh_nomi').value = mahsulot ? (mahsulot.nomi || '') : '';
        document.getElementById('mh_kod').value = mahsulot ? (mahsulot.kod || '') : '';
        document.getElementById('mh_turi').value = mahsulot ? (mahsulot.turi || 'gatoviy') : 'gatoviy';
        document.getElementById('mh_birlik').value = mahsulot ? (mahsulot.birlik || 'dona') : 'dona';
        // Bazada UMUMIY narx so'mda saqlanadi; formaga esa 1 kv narxi kiritiladi —
        // shuning uchun tahrirlashda umumiyni kv'ga bo'lib 1 kv narxini ko'rsatamiz
        let narxKv = '';
        if (mahsulot && mahsulot.zavodNarxi != null) {
            narxKv = (mahsulot.kv != null && mahsulot.kv > 0)
                ? Math.round(mahsulot.zavodNarxi / mahsulot.kv * 100) / 100
                : mahsulot.zavodNarxi;
        }
        document.getElementById('mh_zavod').value = narxKv;
        // Tahrirlashda narx bazada so'mda saqlangan — valyuta so'm qilib ko'rsatiladi,
        // yangi mahsulotda esa default $ turadi
        document.getElementById('mh_valyuta').value = mahsulot ? 'UZS' : 'USD';
        kursHintYangila();
        document.getElementById('mh_boyi').value = mahsulot && mahsulot.boyi != null ? mahsulot.boyi : '';
        document.getElementById('mh_eni').value = mahsulot && mahsulot.eni != null ? mahsulot.eni : '';
        kvYangila();

        await loadKategoriyaSelect(mahsulot ? mahsulot.kategoriyaId : null);
        await loadMagazinSelect(mahsulot ? mahsulot.magazinId : null);

        overlay.classList.add('open');
        document.getElementById('mh_nomi').focus();
    }

    function modalYopish() {
        overlay.classList.remove('open');
        editingId = null;
    }

    document.getElementById('openModalBtn').addEventListener('click', () => modalOchish(null));
    document.getElementById('cancelBtn').addEventListener('click', modalYopish);
    overlay.addEventListener('click', e => { if (e.target === overlay) modalYopish(); });

    // ===== Saqlash =====
    document.getElementById('saveBtn').addEventListener('click', async () => {
        modalError.style.display = 'none';

        const nomi = document.getElementById('mh_nomi').value.trim();
        const kod = document.getElementById('mh_kod').value.trim();
        if (!nomi || !kod) {
            modalError.textContent = 'Mahsulot nomi va kodini kiriting';
            modalError.style.display = 'block';
            return;
        }

        const zavod = document.getElementById('mh_zavod').value;
        const boyi = document.getElementById('mh_boyi').value;
        const eni = document.getElementById('mh_eni').value;
        const magazinVal = document.getElementById('mh_magazin').value;

        const kategoriyaVal = document.getElementById('mh_kategoriya').value;

        const body = {
            nomi: nomi,
            kod: kod,
            kategoriyaId: kategoriyaVal === '' ? null : Number(kategoriyaVal),
            turi: document.getElementById('mh_turi').value,
            birlik: document.getElementById('mh_birlik').value,
            zavodNarxi: zavod === '' ? null : Number(zavod),
            valyuta: document.getElementById('mh_valyuta').value,
            boyi: boyi === '' ? null : Number(boyi),
            eni: eni === '' ? null : Number(eni),
            magazinId: magazinVal === '' ? null : Number(magazinVal)
        };

        const url = editingId ? '/admin/update-mahsulot/' + editingId : '/admin/add-mahsulot';
        const method = editingId ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();

            if (res.ok && data.holat) {
                modalYopish();
                toastKorsat(data.message, true);
                loadMahsulotlar();
            } else {
                modalError.textContent = data.message || 'Xatolik yuz berdi';
                modalError.style.display = 'block';
            }
        } catch (e) {
            modalError.textContent = 'Server bilan aloqa yo\u2018q';
            modalError.style.display = 'block';
        }
    });

    // ===== Tahrirlash / O'chirish =====
    tbody.addEventListener('click', async e => {
        const editBtn = e.target.closest('.edit-btn');
        if (editBtn) {
            const mahsulot = mahsulotlar.find(m => m.id === Number(editBtn.dataset.id));
            if (mahsulot) modalOchish(mahsulot);
            return;
        }

        const delBtn = e.target.closest('.del-btn');
        if (delBtn) {
            if (!confirm(`"${delBtn.dataset.name}" mahsulotini o'chirishni tasdiqlaysizmi?`)) return;
            try {
                const res = await fetch('/admin/delete-mahsulot/' + delBtn.dataset.id, { method: 'DELETE' });
                const data = await res.json();
                toastKorsat(data.message, data.holat);
                if (data.holat) loadMahsulotlar();
            } catch (e) {
                toastKorsat('Server bilan aloqa yo\u2018q', false);
            }
        }
    });

    loadMahsulotlar();
</script>

</body>
</html>
