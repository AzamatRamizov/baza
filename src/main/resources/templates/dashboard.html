<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Kun/tun rejimi: ranglar + rejim boshqaruvi (defer qo'yilmaydi!) -->
    <link rel="stylesheet" href="/tema.css">
    <script src="/tema.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background-color: var(--fon);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--matn);
        }
        .container {
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 20px;
        }
        .welcome-card {
            background-color: var(--karta);
            border-radius: 10px;
            box-shadow: 0 4px 20px var(--soya);
            padding: 32px;
        }
        .welcome-card h1 {
            color: var(--kok);
            font-size: 22px;
            margin-bottom: 10px;
        }
        .welcome-card p {
            color: var(--matn2);
            font-size: 14px;
        }
    </style>
</head>
<body>

<nav th:replace="~{fragment :: navbar}"></nav>
<div th:replace="~{fragment :: xabar}"></div>
<div th:replace="~{fragment :: tasdiq}"></div>

<div class="container">
    <div class="welcome-card">
        <h1>Xush kelibsiz, <span th:text="${username}">user</span>!</h1>
        <p>Siz tizimga muvaffaqiyatli kirdingiz. Dashboard sahifasi shu yerda kengaytiriladi.</p>
    </div>
</div>

</body>
</html>
