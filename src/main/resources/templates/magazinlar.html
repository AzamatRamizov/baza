<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazinlar</title>
    <!-- Kun/tun rejimi: ranglar + rejim boshqaruvi (defer qo'yilmaydi!) -->
    <link rel="stylesheet" href="/tema.css">
    <script src="/tema.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background-color: var(--fon);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--matn);
        }
        .container { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
        .card {
            background-color: var(--karta); border-radius: 10px;
            box-shadow: 0 4px 20px var(--soya); padding: 24px 28px;
        }
        .card-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
        }
        .card-header h1 { color: var(--kok); font-size: 20px; }
        .add-btn {
            padding: 9px 18px; background-color: var(--kok); color: var(--karta); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .add-btn:hover { background-color: var(--kok-hover); }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--chegara); vertical-align: top; }
        th {
            color: var(--kok-och); font-size: 12px; text-transform: uppercase;
            background-color: var(--fon2);
        }
        tr:hover td { background-color: var(--fon4); }
        .hodim-badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600; margin: 2px 4px 2px 0;
            background-color: var(--fon3); color: var(--kok-toq);
        }
        .no-hodim { color: var(--sariq-toq); font-size: 12px; font-weight: 600; }
        .edit-btn {
            padding: 6px 12px; background-color: var(--fon3); color: var(--kok-toq); border: 1px solid var(--chegara-kok);
            border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; margin-right: 6px;
            transition: background-color 0.2s;
        }
        .edit-btn:hover { background-color: var(--chegara3); }
        .del-btn {
            padding: 6px 12px; background-color: var(--qizil-fon); color: var(--qizil); border: 1px solid var(--qizil-3);
            border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .del-btn:hover { background-color: var(--qizil-2); }
        .empty-row td { text-align: center; color: var(--matn4); padding: 24px; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: var(--parda);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--karta); border-radius: 10px; padding: 28px 32px;
            width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto;
            box-shadow: 0 8px 32px var(--soya3);
        }
        .modal h2 { color: var(--kok); font-size: 18px; margin-bottom: 18px; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; margin-bottom: 5px; color: var(--kok-och);
            font-size: 12px; font-weight: 600; text-transform: uppercase;
        }
        .form-group input {
            width: 100%; padding: 9px 12px; border: 1.5px solid var(--chegara-kok); border-radius: 6px;
            font-size: 14px; color: var(--matn); background-color: var(--fon2); outline: none;
            transition: border-color 0.2s; font-family: inherit;
        }
        .form-group input:focus { border-color: var(--kok); background-color: var(--karta); }

        /* Hodim tanlash ro'yxati */
        .hodim-list {
            border: 1.5px solid var(--chegara-kok); border-radius: 6px;
            max-height: 220px; overflow-y: auto; background-color: var(--fon2);
        }
        .hodim-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; cursor: pointer;
            border-bottom: 1px solid var(--chegara);
            transition: background-color 0.15s;
        }
        .hodim-item:last-child { border-bottom: none; }
        .hodim-item:hover { background-color: var(--fon3); }
        .hodim-item input { width: auto; accent-color: var(--kok); cursor: pointer; }
        .hodim-item .h-fish { font-size: 14px; font-weight: 600; color: var(--matn); }
        .hodim-item .h-username { font-size: 12px; color: var(--matn3); }
        .hodim-list .empty { padding: 14px; text-align: center; color: var(--matn4); font-size: 13px; }
        .tanlangan-soni { font-size: 12px; color: var(--kok-och); margin-top: 5px; }

        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions .save-btn {
            flex: 1; padding: 10px; background-color: var(--kok); color: var(--karta); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .modal-actions .save-btn:hover { background-color: var(--kok-hover); }
        .modal-actions .cancel-btn {
            padding: 10px 18px; background-color: var(--fon5); color: var(--kok-och); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .modal-error {
            color: var(--qizil); font-size: 13px; margin-top: 10px; text-align: center; display: none;
        }
    </style>
</head>
<body>

<nav th:replace="~{fragment :: navbar}"></nav>
<div th:replace="~{fragment :: xabar}"></div>
<div th:replace="~{fragment :: tasdiq}"></div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Magazinlar</h1>
            <button class="add-btn" id="openModalBtn">+ Yangi magazin</button>
        </div>
        <table>
            <thead>
            <tr>
                <th style="width:50px">#</th>
                <th>Magazin nomi</th>
                <th>Mas'ul hodimlar</th>
                <th style="width:170px"></th>
            </tr>
            </thead>
            <tbody id="magazinTbody">
            <tr class="empty-row"><td colspan="4">Yuklanmoqda...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Magazin qo'shish/tahrirlash modali -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">Yangi magazin</h2>
        <div class="form-group">
            <label for="m_nomi">Magazin nomi *</label>
            <input type="text" id="m_nomi" placeholder="Masalan: Markaziy do'kon" autocomplete="off">
        </div>
        <div class="form-group">
            <label>Mas'ul hodimlar</label>
            <div class="hodim-list" id="hodimList">
                <div class="empty">Yuklanmoqda...</div>
            </div>
            <div class="tanlangan-soni" id="tanlanganSoni">Tanlangan: 0</div>
        </div>
        <p class="modal-error" id="modalError"></p>
        <div class="modal-actions">
            <button class="save-btn" id="saveBtn">Saqlash</button>
            <button class="cancel-btn" id="cancelBtn">Bekor qilish</button>
        </div>
    </div>
</div>


<script>
    const tbody = document.getElementById('magazinTbody');
    const overlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalError = document.getElementById('modalError');
    const hodimList = document.getElementById('hodimList');
    const tanlanganSoni = document.getElementById('tanlanganSoni');

    let magazinlar = [];   // oxirgi yuklangan ro'yxat
    let hodimlar = [];     // barcha hodimlar (checkbox uchun)
    let editingId = null;  // null = yangi qo'shish, aks holda tahrirlash

    // Xabar fragment.html :: xabar dan keladi (global notification)
    function toastKorsat(matn, ok) {
        xabar(matn, ok ? 'ok' : 'err');
    }

    function esc(s) {
        return (s == null ? '' : String(s))
            .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;');
    }

    // ===== Ro'yxatlarni yuklash =====
    async function loadMagazinlar() {
        try {
            const res = await fetch('/admin/get-magazinlar');
            if (!res.ok) throw new Error();
            magazinlar = await res.json();

            if (!magazinlar.length) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Magazinlar yo\u2018q</td></tr>';
                return;
            }

            tbody.innerHTML = magazinlar.map((m, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><b>${esc(m.nomi)}</b></td>
                    <td>${
                m.hodimlar.length
                    ? m.hodimlar.map(h =>
                        `<span class="hodim-badge" title="${esc(h.username)}">${esc(h.fish || h.username)}</span>`
                    ).join('')
                    : '<span class="no-hodim">Mas\u2019ul hodim belgilanmagan</span>'
            }</td>
                    <td>
                        <button class="edit-btn" data-id="${m.id}">Tahrirlash</button>
                        <button class="del-btn" data-id="${m.id}" data-name="${esc(m.nomi)}">O'chirish</button>
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Yuklashda xatolik</td></tr>';
        }
    }

    async function loadHodimlar() {
        const res = await fetch('/admin/get-users');
        if (!res.ok) throw new Error();
        hodimlar = await res.json();
    }

    // ===== Modal =====
    function hodimCheckboxlarniChiz(tanlanganIds) {
        if (!hodimlar.length) {
            hodimList.innerHTML = '<div class="empty">Hodimlar yo\u2018q — avval Hodimlar sahifasidan qo\u2018shing</div>';
            tanlanganSoniYangila();
            return;
        }
        hodimList.innerHTML = hodimlar.map(h => `
            <label class="hodim-item">
                <input type="checkbox" value="${h.id}" ${tanlanganIds.includes(h.id) ? 'checked' : ''}>
                <span>
                    <span class="h-fish">${esc(h.fish || h.username)}</span>
                    <span class="h-username">@${esc(h.username)}</span>
                </span>
            </label>
        `).join('');
        tanlanganSoniYangila();
    }

    function tanlanganSoniYangila() {
        const soni = hodimList.querySelectorAll('input:checked').length;
        tanlanganSoni.textContent = 'Tanlangan: ' + soni;
    }

    hodimList.addEventListener('change', tanlanganSoniYangila);

    async function modalOchish(magazin) {
        modalError.style.display = 'none';
        editingId = magazin ? magazin.id : null;
        modalTitle.textContent = magazin ? 'Magazinni tahrirlash' : 'Yangi magazin';
        document.getElementById('m_nomi').value = magazin ? magazin.nomi : '';

        try {
            await loadHodimlar();
        } catch (e) {
            hodimList.innerHTML = '<div class="empty">Hodimlarni yuklashda xatolik</div>';
        }
        hodimCheckboxlarniChiz(magazin ? magazin.hodimlar.map(h => h.id) : []);

        overlay.classList.add('open');
        document.getElementById('m_nomi').focus();
    }

    function modalYopish() {
        overlay.classList.remove('open');
        editingId = null;
    }

    document.getElementById('openModalBtn').addEventListener('click', () => modalOchish(null));
    document.getElementById('cancelBtn').addEventListener('click', modalYopish);
    overlay.addEventListener('click', e => { if (e.target === overlay) modalYopish(); });

    // ===== Saqlash (qo'shish yoki tahrirlash) =====
    document.getElementById('saveBtn').addEventListener('click', async () => {
        modalError.style.display = 'none';

        const nomi = document.getElementById('m_nomi').value.trim();
        if (!nomi) {
            modalError.textContent = 'Magazin nomini kiriting';
            modalError.style.display = 'block';
            return;
        }

        const hodimIds = [...hodimList.querySelectorAll('input:checked')]
            .map(cb => Number(cb.value));

        const url = editingId ? '/admin/update-magazin/' + editingId : '/admin/add-magazin';
        const method = editingId ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nomi: nomi, hodimIds: hodimIds })
            });
            const data = await res.json();

            if (res.ok && data.holat) {
                modalYopish();
                toastKorsat(data.message, true);
                loadMagazinlar();
            } else {
                modalError.textContent = data.message || 'Xatolik yuz berdi';
                modalError.style.display = 'block';
            }
        } catch (e) {
            modalError.textContent = 'Server bilan aloqa yo\u2018q';
            modalError.style.display = 'block';
        }
    });

    // ===== Tahrirlash / O'chirish tugmalari =====
    tbody.addEventListener('click', async e => {
        const editBtn = e.target.closest('.edit-btn');
        if (editBtn) {
            const magazin = magazinlar.find(m => m.id === Number(editBtn.dataset.id));
            if (magazin) modalOchish(magazin);
            return;
        }

        const delBtn = e.target.closest('.del-btn');
        if (delBtn) {
            if (!await tasdiq.ochirish(delBtn.dataset.name, 'magazinini')) return;
            try {
                const res = await fetch('/admin/delete-magazin/' + delBtn.dataset.id, { method: 'DELETE' });
                const data = await res.json();
                toastKorsat(data.message, data.holat);
                if (data.holat) loadMagazinlar();
            } catch (e) {
                toastKorsat('Server bilan aloqa yo\u2018q', false);
            }
        }
    });

    loadMagazinlar();
</script>

</body>
</html>
