<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <!-- Kun/tun rejimi: ranglar + rejim boshqaruvi (defer qo'yilmaydi!) -->
    <link rel="stylesheet" href="/tema.css">
    <script src="/tema.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background-color: var(--fon);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--matn);
        }

        .container {
            max-width: 900px; margin: 32px auto; padding: 0 20px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
        }
        @media (max-width: 760px) { .container { grid-template-columns: 1fr; } }

        .card {
            background-color: var(--karta); border-radius: 10px;
            box-shadow: 0 4px 20px var(--soya); padding: 26px 30px;
        }
        .card h2 { color: var(--kok); font-size: 18px; margin-bottom: 18px; }

        .profil-header {
            display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
        }
        .avatar {
            width: 52px; height: 52px; border-radius: 50%;
            background-color: var(--fon3); color: var(--kok-toq);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 700; text-transform: uppercase;
        }
        .profil-header .uname { font-size: 16px; font-weight: 700; color: var(--matn); }
        .role-badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600; margin-top: 3px;
            background-color: var(--fon3); color: var(--kok-toq);
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; margin-bottom: 5px; color: var(--kok-och);
            font-size: 12px; font-weight: 600; text-transform: uppercase;
        }
        .form-group input, .form-group textarea {
            width: 100%; padding: 9px 12px; border: 1.5px solid var(--chegara-kok); border-radius: 6px;
            font-size: 14px; color: var(--matn); background-color: var(--fon2); outline: none;
            transition: border-color 0.2s; font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--kok); background-color: var(--karta);
        }
        .form-group input[disabled] {
            background-color: var(--fon6); color: var(--matn3); cursor: not-allowed;
        }

        .save-btn {
            width: 100%; padding: 10px; background-color: var(--kok); color: var(--karta); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
            margin-top: 6px; transition: background-color 0.2s;
        }
        .save-btn:hover { background-color: var(--kok-hover); }
        .save-btn:disabled { background-color: var(--chegara2); cursor: not-allowed; }

        .msg { font-size: 13px; margin-top: 10px; text-align: center; display: none; }
        .msg.err { color: var(--qizil); }
        .msg.ok { color: var(--yashil); }
    </style>
</head>
<body>

<nav th:replace="~{fragment :: navbar}"></nav>
<div th:replace="~{fragment :: xabar}"></div>
<div th:replace="~{fragment :: tasdiq}"></div>

<div class="container">

    <!-- Shaxsiy ma'lumotlar -->
    <div class="card">
        <div class="profil-header">
            <div class="avatar" id="avatar">?</div>
            <div>
                <div class="uname" id="unameLabel">...</div>
                <span class="role-badge" id="roleLabel">...</span>
            </div>
        </div>
        <h2>Shaxsiy ma'lumotlar</h2>
        <div class="form-group">
            <label for="p_username">Username</label>
            <input type="text" id="p_username" disabled title="Username o'zgartirilmaydi">
        </div>
        <div class="form-group">
            <label for="p_fish">F.I.Sh</label>
            <input type="text" id="p_fish" placeholder="Familiya Ism Sharif">
        </div>
        <div class="form-group">
            <label for="p_tel">Telefon</label>
            <input type="text" id="p_tel" placeholder="+998 90 123 45 67">
        </div>
        <div class="form-group">
            <label for="p_address">Manzil</label>
            <input type="text" id="p_address" placeholder="Manzil">
        </div>
        <div class="form-group">
            <label for="p_izoh">Izoh</label>
            <textarea id="p_izoh" rows="2" placeholder="Izoh (ixtiyoriy)"></textarea>
        </div>
        <button class="save-btn" id="saveProfilBtn">Saqlash</button>
        <p class="msg" id="profilMsg"></p>
    </div>

    <!-- Parolni o'zgartirish -->
    <div class="card">
        <h2>Parolni o'zgartirish</h2>
        <div class="form-group">
            <label for="eski_parol">Eski parol</label>
            <input type="password" id="eski_parol" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="form-group">
            <label for="yangi_parol">Yangi parol</label>
            <input type="password" id="yangi_parol" placeholder="••••••••" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="yangi_parol2">Yangi parol (takror)</label>
            <input type="password" id="yangi_parol2" placeholder="••••••••" autocomplete="new-password">
        </div>
        <button class="save-btn" id="saveParolBtn">Parolni yangilash</button>
        <p class="msg" id="parolMsg"></p>
    </div>

</div>


<script>

    // Xabar fragment.html :: xabar dan keladi (global notification)
    function toastKorsat(matn, ok) {
        xabar(matn, ok ? 'ok' : 'err');
    }

    function msgKorsat(el, matn, ok) {
        el.textContent = matn;
        el.className = 'msg ' + (ok ? 'ok' : 'err');
        el.style.display = 'block';
    }

    // ===== Profilni yuklash =====
    async function loadProfil() {
        try {
            const res = await fetch('/admin/get-profil');
            if (!res.ok) throw new Error();
            const u = await res.json();

            document.getElementById('p_username').value = u.username || '';
            document.getElementById('p_fish').value = u.fish || '';
            document.getElementById('p_tel').value = u.tel || '';
            document.getElementById('p_address').value = u.address || '';
            document.getElementById('p_izoh').value = u.izoh || '';

            document.getElementById('unameLabel').textContent = u.username || '';
            document.getElementById('roleLabel').textContent =
                (u.rollar && u.rollar.length) ? u.rollar.map(r => r.nomi).join(', ') : 'Rolsiz';
            document.getElementById('avatar').textContent =
                (u.fish || u.username || '?').trim().charAt(0);
        } catch (e) {
            toastKorsat('Profilni yuklashda xatolik', false);
        }
    }

    // ===== Profilni saqlash =====
    document.getElementById('saveProfilBtn').addEventListener('click', async () => {
        const msg = document.getElementById('profilMsg');
        msg.style.display = 'none';

        const body = {
            fish: document.getElementById('p_fish').value.trim(),
            tel: document.getElementById('p_tel').value.trim(),
            address: document.getElementById('p_address').value.trim(),
            izoh: document.getElementById('p_izoh').value.trim()
        };

        try {
            const res = await fetch('/admin/update-profil', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();

            if (res.ok && data.holat) {
                toastKorsat(data.message, true);
                loadProfil();
            } else {
                msgKorsat(msg, data.message || 'Xatolik yuz berdi', false);
            }
        } catch (e) {
            msgKorsat(msg, 'Server bilan aloqa yo\u2018q', false);
        }
    });

    // ===== Parolni yangilash =====
    document.getElementById('saveParolBtn').addEventListener('click', async () => {
        const msg = document.getElementById('parolMsg');
        msg.style.display = 'none';

        const eski = document.getElementById('eski_parol').value;
        const yangi = document.getElementById('yangi_parol').value;
        const yangi2 = document.getElementById('yangi_parol2').value;

        if (!eski || !yangi) {
            msgKorsat(msg, 'Eski va yangi parolni kiriting', false);
            return;
        }
        if (yangi !== yangi2) {
            msgKorsat(msg, 'Yangi parollar mos kelmadi', false);
            return;
        }

        try {
            const res = await fetch('/admin/update-parol', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ eskiParol: eski, yangiParol: yangi })
            });
            const data = await res.json();

            if (res.ok && data.holat) {
                toastKorsat(data.message, true);
                ['eski_parol', 'yangi_parol', 'yangi_parol2']
                    .forEach(id => document.getElementById(id).value = '');
            } else {
                msgKorsat(msg, data.message || 'Xatolik yuz berdi', false);
            }
        } catch (e) {
            msgKorsat(msg, 'Server bilan aloqa yo\u2018q', false);
        }
    });

    loadProfil();
</script>

</body>
</html>
