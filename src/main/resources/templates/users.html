<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hodimlar</title>
    <!-- Kun/tun rejimi: ranglar + rejim boshqaruvi (defer qo'yilmaydi!) -->
    <link rel="stylesheet" href="/tema.css">
    <script src="/tema.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background-color: var(--fon);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--matn);
        }

        .container { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
        .card {
            background-color: var(--karta); border-radius: 10px;
            box-shadow: 0 4px 20px var(--soya); padding: 24px 28px;
        }
        .card-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
        }
        .card-header h1 { color: var(--kok); font-size: 20px; }
        .add-btn {
            padding: 9px 18px; background-color: var(--kok); color: var(--karta); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .add-btn:hover { background-color: var(--kok-hover); }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--chegara); }
        th {
            color: var(--kok-och); font-size: 12px; text-transform: uppercase;
            background-color: var(--fon2);
        }
        tr:hover td { background-color: var(--fon4); }
        .rol-cell { position: relative; display: inline-block; }
        .rol-btn {
            padding: 6px 10px; border: 1.5px solid var(--chegara-kok); border-radius: 6px;
            font-size: 13px; font-weight: 600; color: var(--kok-toq);
            background-color: var(--fon2); cursor: pointer; font-family: inherit;
            white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis;
        }
        .rol-btn:hover { border-color: var(--kok); background-color: var(--fon3); }
        .rol-panel {
            position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
            min-width: 180px; background: var(--karta); border: 1px solid var(--chegara);
            border-radius: 8px; box-shadow: 0 6px 24px var(--soya4);
            padding: 6px 0; display: none;
        }
        .rol-cell.open .rol-panel { display: block; }
        .rol-panel label {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 14px; font-size: 13px; cursor: pointer;
        }
        .rol-panel label:hover { background-color: var(--fon2); }
        .rol-panel input { accent-color: var(--kok); cursor: pointer; }
        .menejer-select {
            padding: 6px 10px; border: 1.5px solid var(--chegara-kok); border-radius: 6px;
            font-size: 13px; font-weight: 600; color: var(--kok-toq);
            background-color: var(--fon2); outline: none; cursor: pointer;
            font-family: inherit; max-width: 200px;
        }
        .menejer-select:focus { border-color: var(--kok); background-color: var(--karta); }
        .del-btn {
            padding: 6px 12px; background-color: var(--qizil-fon); color: var(--qizil); border: 1px solid var(--qizil-3);
            border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .del-btn:hover { background-color: var(--qizil-2); }
        .empty-row td { text-align: center; color: var(--matn4); padding: 24px; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: var(--parda);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--karta); border-radius: 10px; padding: 28px 32px;
            width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto;
            box-shadow: 0 8px 32px var(--soya3);
        }
        .modal h2 { color: var(--kok); font-size: 18px; margin-bottom: 18px; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; margin-bottom: 5px; color: var(--kok-och);
            font-size: 12px; font-weight: 600; text-transform: uppercase;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 9px 12px; border: 1.5px solid var(--chegara-kok); border-radius: 6px;
            font-size: 14px; color: var(--matn); background-color: var(--fon2); outline: none;
            transition: border-color 0.2s; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--kok); background-color: var(--karta);
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions .save-btn {
            flex: 1; padding: 10px; background-color: var(--kok); color: var(--karta); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .modal-actions .save-btn:hover { background-color: var(--kok-hover); }
        .modal-actions .cancel-btn {
            padding: 10px 18px; background-color: var(--fon5); color: var(--kok-och); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .modal-error {
            color: var(--qizil); font-size: 13px; margin-top: 10px; text-align: center; display: none;
        }
    </style>
</head>
<body>

<nav th:replace="~{fragment :: navbar}"></nav>
<div th:replace="~{fragment :: xabar}"></div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Hodimlar</h1>
            <button class="add-btn" id="openModalBtn">+ Yangi hodim</button>
        </div>
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>F.I.Sh</th>
                <th>Telefon</th>
                <th>Manzil</th>
                <th>Username</th>
                <th>Rol</th>
                <th>Menejer</th>
                <th>Izoh</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="usersTbody">
            <tr class="empty-row"><td colspan="9">Yuklanmoqda...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Yangi hodim modali -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2>Yangi hodim qo'shish</h2>
        <div class="form-group">
            <label for="u_fish">F.I.Sh</label>
            <input type="text" id="u_fish" placeholder="Familiya Ism Sharif">
        </div>
        <div class="form-group">
            <label for="u_tel">Telefon</label>
            <input type="text" id="u_tel" placeholder="+998 90 123 45 67">
        </div>
        <div class="form-group">
            <label for="u_address">Manzil</label>
            <input type="text" id="u_address" placeholder="Manzil">
        </div>
        <div class="form-group">
            <label for="u_username">Username *</label>
            <input type="text" id="u_username" placeholder="Username" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="u_password">Parol *</label>
            <input type="password" id="u_password" placeholder="Parol" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label>Rollar * <span style="text-transform:none; font-weight:400">(bir nechtasini tanlash mumkin)</span></label>
            <div class="rol-panel" id="u_rollar"
                 style="display:block; position:static; box-shadow:none; border:1.5px solid var(--chegara-kok); max-height:160px; overflow-y:auto;">
                <label style="color:var(--matn4)">Yuklanmoqda...</label>
            </div>
        </div>
        <div class="form-group" id="menejerGroup" style="display:none;">
            <label for="u_menejer">Menejer</label>
            <select id="u_menejer">
                <option value="">— Menejersiz —</option>
            </select>
        </div>
        <div class="form-group">
            <label for="u_izoh">Izoh</label>
            <textarea id="u_izoh" rows="2" placeholder="Izoh (ixtiyoriy)"></textarea>
        </div>
        <p class="modal-error" id="modalError"></p>
        <div class="modal-actions">
            <button class="save-btn" id="saveUserBtn">Saqlash</button>
            <button class="cancel-btn" id="cancelBtn">Bekor qilish</button>
        </div>
    </div>
</div>


<script>
    const tbody = document.getElementById('usersTbody');
    const overlay = document.getElementById('modalOverlay');
    const modalError = document.getElementById('modalError');
    let rollar = [];
    let oxirgiUsers = [];

    // Xabar fragment.html :: xabar dan keladi (global notification)
    function toastKorsat(matn, ok) {
        xabar(matn, ok ? 'ok' : 'err');
    }

    function esc(s) {
        return (s == null ? '' : String(s))
            .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;');
    }

    async function loadRollar() {
        try {
            const res = await fetch('/admin/get-rollar');
            if (!res.ok) throw new Error();
            rollar = await res.json();
        } catch (e) {
            rollar = [];
        }
        // Modal checkbox ro'yxatini to'ldirish
        const modalRollar = document.getElementById('u_rollar');
        modalRollar.innerHTML = rollar.length
            ? rollar.map(r =>
                `<label><input type="checkbox" value="${r.id}"> ${esc(r.nomi)}</label>`).join('')
            : '<label style="color:var(--matn4)">Rollar yo‘q — avval Rollar sahifasidan qo‘shing</label>';
    }

    // Userning biror rolida "menejer biriktiriladi" belgisi bormi
    function menejerKerakmi(user) {
        return user.rollar.some(ur => {
            const rol = rollar.find(r => r.id === ur.id);
            return rol && rol.menejerKerak;
        });
    }

    function menejerHujayraHtml(user, users) {
        if (!menejerKerakmi(user)) {
            return '<span style="color:var(--matn4)">—</span>';
        }
        const options = ['<option value="">— Menejersiz —</option>']
            .concat(users
                .filter(u => u.id !== user.id)
                .map(u => {
                    const nom = esc(u.fish || u.username);
                    return `<option value="${u.id}" ${user.menejerId === u.id ? 'selected' : ''}>${nom}</option>`;
                }));
        return `<select class="menejer-select" data-id="${user.id}">${options.join('')}</select>`;
    }

    function rolHujayraHtml(user) {
        const nomlar = user.rollar.length
            ? user.rollar.map(r => esc(r.nomi)).join(', ')
            : '— Rolsiz —';
        const checkboxlar = rollar.map(r => {
            const checked = user.rollar.some(x => x.id === r.id) ? 'checked' : '';
            return `<label><input type="checkbox" value="${r.id}" ${checked}> ${esc(r.nomi)}</label>`;
        }).join('');
        return `<div class="rol-cell" data-id="${user.id}">
            <button class="rol-btn" type="button">${nomlar} ▾</button>
            <div class="rol-panel">${checkboxlar}</div>
        </div>`;
    }

    async function loadUsers() {
        try {
            const res = await fetch('/admin/get-users');
            if (!res.ok) throw new Error();
            const users = await res.json();
            oxirgiUsers = users;

            if (!users.length) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="9">Hodimlar yo\u2018q</td></tr>';
                return;
            }

            tbody.innerHTML = users.map((u, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${esc(u.fish)}</td>
                    <td>${esc(u.tel)}</td>
                    <td>${esc(u.address)}</td>
                    <td>${esc(u.username)}</td>
                    <td>${rolHujayraHtml(u)}</td>
                    <td>${menejerHujayraHtml(u, users)}</td>
                    <td>${esc(u.izoh)}</td>
                    <td><button class="del-btn" data-id="${u.id}" data-name="${esc(u.username)}">O'chirish</button></td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="9">Yuklashda xatolik</td></tr>';
        }
    }

    // ===== Modal =====
    function modalOchish() {
        modalError.style.display = 'none';
        document.getElementById('menejerGroup').style.display = 'none';
        // Menejer selectini joriy hodimlardan to'ldiramiz
        const menejerSelect = document.getElementById('u_menejer');
        menejerSelect.innerHTML = '<option value="">— Menejersiz —</option>' +
            oxirgiUsers.map(u => `<option value="${u.id}">${esc(u.fish || u.username)}</option>`).join('');
        overlay.classList.add('open');
        document.getElementById('u_fish').focus();
    }
    function modalYopish() {
        overlay.classList.remove('open');
        ['u_fish', 'u_tel', 'u_address', 'u_username', 'u_password', 'u_izoh']
            .forEach(id => document.getElementById(id).value = '');
        document.querySelectorAll('#u_rollar input').forEach(cb => cb.checked = false);
    }

    // Modal rollar checkboxi o'zgarganda — menejer maydonini ko'rsatish/yashirish
    document.getElementById('u_rollar').addEventListener('change', () => {
        const tanlanganIds = [...document.querySelectorAll('#u_rollar input:checked')]
            .map(cb => Number(cb.value));
        const kerak = rollar.some(r => tanlanganIds.includes(r.id) && r.menejerKerak);
        document.getElementById('menejerGroup').style.display = kerak ? 'block' : 'none';
    });

    document.getElementById('openModalBtn').addEventListener('click', modalOchish);
    document.getElementById('cancelBtn').addEventListener('click', modalYopish);
    overlay.addEventListener('click', e => { if (e.target === overlay) modalYopish(); });

    // ===== Qatordagi rol paneli — ochish/yopish =====
    tbody.addEventListener('click', e => {
        const btn = e.target.closest('.rol-btn');
        if (!btn) return;
        const cell = btn.closest('.rol-cell');
        // Boshqa ochiq panellarni yopamiz
        tbody.querySelectorAll('.rol-cell.open').forEach(c => {
            if (c !== cell) c.classList.remove('open');
        });
        cell.classList.toggle('open');
    });

    document.addEventListener('click', e => {
        if (!e.target.closest('.rol-cell')) {
            tbody.querySelectorAll('.rol-cell.open').forEach(c => c.classList.remove('open'));
        }
    });

    // ===== Menejer select — o'zgarganda darhol saqlanadi =====
    tbody.addEventListener('change', async e => {
        const select = e.target.closest('.menejer-select');
        if (!select) return;

        const userId = select.dataset.id;
        const menejerId = select.value;

        try {
            const res = await fetch('/admin/update-user-menejer/' + userId +
                    (menejerId ? '?menejerId=' + menejerId : ''), { method: 'PUT' });
            const data = await res.json();
            toastKorsat(data.message, data.holat);
            if (!data.holat) loadUsers();
        } catch (err) {
            toastKorsat('Server bilan aloqa yo‘q', false);
            loadUsers();
        }
    });

    // ===== Checkbox o'zgarganda — tanlangan rollar to'liq yuboriladi =====
    tbody.addEventListener('change', async e => {
        const cell = e.target.closest('.rol-cell');
        if (!cell) return;

        const userId = cell.dataset.id;
        const rolIds = [...cell.querySelectorAll('input:checked')].map(cb => Number(cb.value));

        try {
            const res = await fetch('/admin/update-user-rollar/' + userId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(rolIds)
            });
            const data = await res.json();
            toastKorsat(data.message, data.holat);
            if (data.holat) {
                // Tugma yozuvini yangilaymiz (panel ochiq qoladi)
                const nomlar = rollar.filter(r => rolIds.includes(r.id)).map(r => esc(r.nomi));
                cell.querySelector('.rol-btn').innerHTML =
                    (nomlar.length ? nomlar.join(', ') : '— Rolsiz —') + ' ▾';
            } else {
                loadUsers();
            }
        } catch (err) {
            toastKorsat('Server bilan aloqa yo‘q', false);
            loadUsers();
        }
    });

    // ===== Saqlash =====
    document.getElementById('saveUserBtn').addEventListener('click', async () => {
        modalError.style.display = 'none';

        const body = {
            fish: document.getElementById('u_fish').value.trim(),
            tel: document.getElementById('u_tel').value.trim(),
            address: document.getElementById('u_address').value.trim(),
            izoh: document.getElementById('u_izoh').value.trim(),
            username: document.getElementById('u_username').value.trim(),
            password: document.getElementById('u_password').value,
            rolIds: [...document.querySelectorAll('#u_rollar input:checked')].map(cb => Number(cb.value)),
            menejerId: document.getElementById('u_menejer').value
                ? Number(document.getElementById('u_menejer').value) : null
        };

        if (!body.username || !body.password) {
            modalError.textContent = 'Username va parol kiritilishi shart';
            modalError.style.display = 'block';
            return;
        }
        if (!body.rolIds.length) {
            modalError.textContent = 'Kamida bitta rol tanlang';
            modalError.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/admin/add-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();

            if (res.ok && data.holat) {
                modalYopish();
                toastKorsat(data.message, true);
                loadUsers();
            } else {
                modalError.textContent = data.message || 'Xatolik yuz berdi';
                modalError.style.display = 'block';
            }
        } catch (e) {
            modalError.textContent = 'Server bilan aloqa yo\u2018q';
            modalError.style.display = 'block';
        }
    });

    // ===== O'chirish =====
    tbody.addEventListener('click', async e => {
        const btn = e.target.closest('.del-btn');
        if (!btn) return;

        if (!confirm(`"${btn.dataset.name}" hodimini o'chirishni tasdiqlaysizmi?`)) return;

        try {
            const res = await fetch('/admin/delete-user/' + btn.dataset.id, { method: 'DELETE' });
            const data = await res.json();
            toastKorsat(data.message, data.holat);
            if (data.holat) loadUsers();
        } catch (e) {
            toastKorsat('Server bilan aloqa yo\u2018q', false);
        }
    });

    loadRollar().then(loadUsers);
</script>

</body>
</html>
