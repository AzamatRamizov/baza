<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rollar</title>
    <!-- Kun/tun rejimi: ranglar + rejim boshqaruvi (defer qo'yilmaydi!) -->
    <link rel="stylesheet" href="/tema.css">
    <script src="/tema.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background-color: var(--fon);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--matn);
        }
        .container { max-width: 700px; margin: 32px auto; padding: 0 20px; }
        .card {
            background-color: var(--karta); border-radius: 10px;
            box-shadow: 0 4px 20px var(--soya); padding: 24px 28px;
        }
        .card-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
        }
        .card-header h1 { color: var(--kok); font-size: 20px; }
        .add-btn {
            padding: 9px 18px; background-color: var(--kok); color: var(--karta); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .add-btn:hover { background-color: var(--kok-hover); }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--chegara); }
        th {
            color: var(--kok-och); font-size: 12px; text-transform: uppercase;
            background-color: var(--fon2);
        }
        tr:hover td { background-color: var(--fon4); }
        .edit-btn {
            padding: 6px 12px; background-color: var(--fon3); color: var(--kok-toq); border: 1px solid var(--chegara-kok);
            border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; margin-right: 6px;
            transition: background-color 0.2s;
        }
        .edit-btn:hover { background-color: var(--chegara3); }
        .del-btn {
            padding: 6px 12px; background-color: var(--qizil-fon); color: var(--qizil); border: 1px solid var(--qizil-3);
            border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .del-btn:hover { background-color: var(--qizil-2); }
        .empty-row td { text-align: center; color: var(--matn4); padding: 24px; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: var(--parda);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--karta); border-radius: 10px; padding: 28px 32px;
            width: 100%; max-width: 400px;
            box-shadow: 0 8px 32px var(--soya3);
        }
        .modal h2 { color: var(--kok); font-size: 18px; margin-bottom: 18px; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; margin-bottom: 5px; color: var(--kok-och);
            font-size: 12px; font-weight: 600; text-transform: uppercase;
        }
        .form-group input {
            width: 100%; padding: 9px 12px; border: 1.5px solid var(--chegara-kok); border-radius: 6px;
            font-size: 14px; color: var(--matn); background-color: var(--fon2); outline: none;
            transition: border-color 0.2s; font-family: inherit;
        }
        .form-group input:focus { border-color: var(--kok); background-color: var(--karta); }
        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions .save-btn {
            flex: 1; padding: 10px; background-color: var(--kok); color: var(--karta); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .modal-actions .save-btn:hover { background-color: var(--kok-hover); }
        .modal-actions .cancel-btn {
            padding: 10px 18px; background-color: var(--fon5); color: var(--kok-och); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .modal-error {
            color: var(--qizil); font-size: 13px; margin-top: 10px; text-align: center; display: none;
        }
    </style>
</head>
<body>

<nav th:replace="~{fragment :: navbar}"></nav>
<div th:replace="~{fragment :: xabar}"></div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Rollar</h1>
            <a href="/admin/ruxsatlar" style="margin-left:auto; margin-right:12px; color:var(--kok-toq); font-size:13px; font-weight:600;">Ruxsatlarni sozlash &rarr;</a>
            <button class="add-btn" id="openModalBtn" style="margin-left:0">+ Yangi rol</button>
        </div>
        <table>
            <thead>
            <tr>
                <th style="width:60px">#</th>
                <th>Nomi</th>
                <th>Hodimlar</th>
                <th>Ruxsatlar</th>
                <th style="width:180px"></th>
            </tr>
            </thead>
            <tbody id="rolTbody">
            <tr class="empty-row"><td colspan="5">Yuklanmoqda...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Kategoriya qo'shish/tahrirlash modali -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">Yangi rol</h2>
        <div class="form-group">
            <label for="k_nomi">Rol nomi *</label>
            <input type="text" id="k_nomi" placeholder="Masalan: Sotuvchi" autocomplete="off">
        </div>
        <div class="form-group">
            <label style="display:flex; align-items:center; gap:8px; text-transform:none; cursor:pointer; font-size:14px; color:var(--matn);">
                <input type="checkbox" id="k_menejerKerak"
                       style="width:16px; height:16px; accent-color:var(--kok); cursor:pointer;">
                Bu roldagi hodimga menejer biriktiriladi
            </label>
        </div>
        <p class="modal-error" id="modalError"></p>
        <div class="modal-actions">
            <button class="save-btn" id="saveBtn">Saqlash</button>
            <button class="cancel-btn" id="cancelBtn">Bekor qilish</button>
        </div>
    </div>
</div>


<script>
    const tbody = document.getElementById('rolTbody');
    const overlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalError = document.getElementById('modalError');

    let rollar = [];
    let editingId = null;

    // Xabar fragment.html :: xabar dan keladi (global notification)
    function toastKorsat(matn, ok) {
        xabar(matn, ok ? 'ok' : 'err');
    }

    function esc(s) {
        return (s == null ? '' : String(s))
            .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;');
    }

    async function loadRollar() {
        try {
            const res = await fetch('/admin/get-rollar');
            if (!res.ok) throw new Error();
            rollar = await res.json();

            if (!rollar.length) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Rollar yo\u2018q</td></tr>';
                return;
            }

            tbody.innerHTML = rollar.map((k, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><b>${esc(k.nomi)}</b>${k.menejerKerak
                        ? ' <span style="font-size:11px; background:var(--sariq-fon); color:var(--sariq-toq2); padding:2px 8px; border-radius:10px; font-weight:600">menejer biriktiriladi</span>'
                        : ''}</td>
                    <td>${k.userSoni} ta hodim</td>
                    <td>${k.tizimRoli ? 'Barchasi (tizim roli)' : k.ruxsatlar.length + ' ta ruxsat'}</td>
                    <td>${k.tizimRoli
                        ? '<span style="color:var(--matn4); font-size:12px; font-weight:600">🔒 Tizim roli</span>'
                        : `<button class="edit-btn" data-id="${k.id}">Tahrirlash</button>
                           <button class="del-btn" data-id="${k.id}" data-name="${esc(k.nomi)}">O'chirish</button>`}
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Yuklashda xatolik</td></tr>';
        }
    }

    // ===== Modal =====
    function modalOchish(kategoriya) {
        modalError.style.display = 'none';
        editingId = kategoriya ? kategoriya.id : null;
        modalTitle.textContent = kategoriya ? 'Rolni tahrirlash' : 'Yangi rol';
        document.getElementById('k_nomi').value = kategoriya ? kategoriya.nomi : '';
        document.getElementById('k_menejerKerak').checked = kategoriya ? !!kategoriya.menejerKerak : false;
        overlay.classList.add('open');
        document.getElementById('k_nomi').focus();
    }

    function modalYopish() {
        overlay.classList.remove('open');
        editingId = null;
    }

    document.getElementById('openModalBtn').addEventListener('click', () => modalOchish(null));
    document.getElementById('cancelBtn').addEventListener('click', modalYopish);
    overlay.addEventListener('click', e => { if (e.target === overlay) modalYopish(); });
    document.getElementById('k_nomi').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('saveBtn').click();
    });

    // ===== Saqlash =====
    document.getElementById('saveBtn').addEventListener('click', async () => {
        modalError.style.display = 'none';

        const nomi = document.getElementById('k_nomi').value.trim();
        if (!nomi) {
            modalError.textContent = 'Rol nomini kiriting';
            modalError.style.display = 'block';
            return;
        }

        const url = editingId ? '/admin/update-rol/' + editingId : '/admin/add-rol';
        const method = editingId ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nomi: nomi,
                    menejerKerak: document.getElementById('k_menejerKerak').checked
                })
            });
            const data = await res.json();

            if (res.ok && data.holat) {
                modalYopish();
                toastKorsat(data.message, true);
                loadRollar();
            } else {
                modalError.textContent = data.message || 'Xatolik yuz berdi';
                modalError.style.display = 'block';
            }
        } catch (e) {
            modalError.textContent = 'Server bilan aloqa yo\u2018q';
            modalError.style.display = 'block';
        }
    });

    // ===== Tahrirlash / O'chirish =====
    tbody.addEventListener('click', async e => {
        const editBtn = e.target.closest('.edit-btn');
        if (editBtn) {
            const kategoriya = rollar.find(k => k.id === Number(editBtn.dataset.id));
            if (kategoriya) modalOchish(kategoriya);
            return;
        }

        const delBtn = e.target.closest('.del-btn');
        if (delBtn) {
            if (!confirm(`"${delBtn.dataset.name}" rolini o'chirishni tasdiqlaysizmi?`)) return;
            try {
                const res = await fetch('/admin/delete-rol/' + delBtn.dataset.id, { method: 'DELETE' });
                const data = await res.json();
                toastKorsat(data.message, data.holat);
                if (data.holat) loadRollar();
            } catch (e) {
                toastKorsat('Server bilan aloqa yo\u2018q', false);
            }
        }
    });

    loadRollar();
</script>

</body>
</html>
