<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/888.png">
    <title>Login</title>
    <!-- Kun/tun rejimi: ranglar + rejim boshqaruvi (defer qo'yilmaydi!) -->
    <link rel="stylesheet" href="/tema.css">
    <script src="/tema.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .error-msg {
            color: var(--qizil);
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .warn-msg {
            color: var(--sariq);
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            padding: 8px;
            background: var(--sariq-fon2);
            border: 1px solid var(--sariq-chegara);
            border-radius: 6px;
            display: none;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--fon);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background-color: var(--karta);
            padding: 40px 48px;
            border-radius: 10px;
            box-shadow: 0 4px 20px var(--soya);
            width: 100%;
            max-width: 380px;
        }
        .login-card h2 {
            text-align: center;
            color: var(--kok);
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--kok-och);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--chegara-kok);
            border-radius: 6px;
            font-size: 15px;
            color: var(--matn);
            background-color: var(--fon2);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--kok);
            background-color: var(--karta);
        }
        .login-btn {
            width: 100%;
            padding: 11px;
            background-color: var(--kok);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        .login-btn:hover { background-color: var(--kok-hover); }
        .error-msg {
            color: var(--qizil);
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

<!-- Kun/tun tugmasi (o‘ng yuqorida) -->
<button class="tema-btn" type="button" onclick="temaAlmash()"
        style="position: fixed; top: 20px; right: 20px;"
        title="Kun / tun rejimi" aria-label="Kun / tun rejimi">
    <span class="tun-ikon">&#127769;</span>
    <span class="kun-ikon">&#9728;</span>
</button>

<div class="login-card">
    <h2>Kirish</h2>
    <div class="form-group">
        <label for="login">Foydalanuvchi nomi</label>
        <input type="text" id="login" name="username" placeholder="Username" required />
    </div>
    <div class="form-group">
        <label for="password">Parol</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
    </div>
    <button class="login-btn" id="submitbtn">Kirish</button>
    <p class="warn-msg" id="warnMsg"></p>
    <p class="error-msg" id="errorMsg">Xato username yoki parol!</p>
</div>

<script src="/login.js"></script>
</body>
</html>
