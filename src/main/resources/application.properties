spring.application.name=Baza

spring.datasource.url=jdbc:postgresql://localhost:5432/baza
spring.datasource.username=postgres
spring.datasource.password=12345678
server.port=80

spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Mahsulot rasmlari qayerga saqlanadi (dastur ishga tushgan papkaga nisbatan,
#    yoki absolyut yo'l) — WebConfig shu papkani /uploads/** orqali serve qiladi ──
app.upload-dir=uploads

# ── Gilam dasturi bilan integratsiya (KATM so'rovlari) ──
# KATMga o'tkazilgan sotuv shu manzilga yuboriladi, shartnoma o'sha yerda tuziladi.
# Gilam qaysi server/portda tursa — o'shani yozing (ikkalasi ham 80-portda tura olmaydi).
gilam.url=http://localhost:8080
# Ikkala dasturda BIR XIL bo'lishi shart (gilamda: katm.token)
gilam.token=KATM-MAXFIY-KALIT-2026
# false qilsangiz so'rov yuborilmaydi (sotuv baribir KATMDA holatida band bo'lib turadi)
gilam.enabled=true

# ── Instagram/Meta Lead Ads integratsiyasi (Arizalar bo'limi) ──
# Webhook tekshiruv tokeni: o'zingiz o'ylab topasiz, Meta Developer App > Webhooks
# sozlashda xuddi shu qiymatni "Verify Token" maydoniga kiritasiz.
instagram.verify-token=${INSTAGRAM_VERIFY_TOKEN:baza-ig-2026-maxfiy-kalit}
# App Secret: Meta Developer App > Settings > Basic > App Secret
instagram.app-secret=${INSTAGRAM_APP_SECRET:77affb8f95ac3cd1dc1115b442f61989}
instagram.graph-api-base-url=https://graph.facebook.com/v21.0
# Page Access Token endi bazada saqlanadi (Instagram akkauntlar bo'limi),
# chunki bir nechta Page/akkaunt qo'llab-quvvatlanadi — shu yerda kerak emas.
