spring.application.name=Baza

spring.datasource.url=jdbc:postgresql://localhost:5432/baza
spring.datasource.username=postgres
spring.datasource.password=12345678
server.port=80

spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=5MB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Gilam dasturi bilan integratsiya (KATM so'rovlari) ──
# KATMga o'tkazilgan sotuv shu manzilga yuboriladi, shartnoma o'sha yerda tuziladi.
# Gilam qaysi server/portda tursa — o'shani yozing (ikkalasi ham 80-portda tura olmaydi).
gilam.url=http://localhost:8080
# Ikkala dasturda BIR XIL bo'lishi shart (gilamda: katm.token)
gilam.token=KATM-MAXFIY-KALIT-2026
# false qilsangiz so'rov yuborilmaydi (sotuv baribir KATMDA holatida band bo'lib turadi)
gilam.enabled=true
